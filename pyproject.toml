[project]
name = "websem-monorepo"
version = "0.1.4"
requires-python = ">=3.11"
dependencies = [
  "mkdocs-websem==0.1.4",
  "websem-builder==0.1.4",
  "websem-client==0.1.4",
  "websem-types==0.1.4",
]

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.1",
  "ruff>=0.12.5",
]

[tool.uv.workspace]
members = [
  "packages/python/websem-types",
  "packages/python/websem-client",
  "packages/python/websem-builder",
  "packages/python/mkdocs-websem",
]

[tool.uv.sources]
websem-types = { workspace = true }
websem-client = { workspace = true }
websem-builder = { workspace = true }
mkdocs-websem = { workspace = true }

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["packages/python"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["websem_types", "websem_client", "websem_builder", "mkdocs_websem"]
mypy_path = [
  "packages/python/websem-types/src",
  "packages/python/websem-client/src",
  "packages/python/websem-builder/src",
  "packages/python/mkdocs-websem/src",
]

[[tool.mypy.overrides]]
module = "mkdocs.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mkdocs_websem.*"
disable_error_code = ["no-untyped-call"]
