name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11"

      - run: npm ci
      - run: uv sync --locked --all-packages
      - run: npm run lint
      - run: npm run format
      - run: npm run test
      - run: npm run build
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  publish-npm:
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci
      - run: npm run build
      - run: npm publish --workspaces --access public

  publish-github:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11"

      - run: uv build --all-packages --out-dir dist-python
      - run: gh release create "$GITHUB_REF_NAME" dist-python/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  publish-pypi:
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: websem-types
            environment: pypi-websem-types
          - package: websem-client
            environment: pypi-websem-client
          - package: websem-builder
            environment: pypi-websem-builder
          - package: mkdocs-websem
            environment: pypi-mkdocs-websem

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11"

      - run: uv build --package "${{ matrix.package }}" --out-dir dist-python
      - if: matrix.package != 'mkdocs-websem' || vars.MKDOCS_WEBSEM_PYPI_ENABLED == 'true'
        run: uv publish dist-python/*
