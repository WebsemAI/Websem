[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "websem-types"
version = "0.1.1"
description = "Shared Python types for websem browser semantic search artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.urls]
Repository = "https://github.com/WebsemAI/Websem"

[tool.hatch.build.targets.wheel]
packages = ["src/websem_types"]
