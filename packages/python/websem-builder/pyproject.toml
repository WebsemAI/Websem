[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "websem-builder"
version = "0.1.0"
description = "Build browser-ready websem semantic search artifacts"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "model2vec>=0.6.0",
  "numpy>=1.26.0,<2.3",
  "websem-types>=0.1.0",
]

[project.scripts]
websem-build = "websem_builder.cli:main"
websem-export-model = "websem_builder.cli:export_main"

[tool.hatch.build.targets.wheel]
packages = ["src/websem_builder"]
